[package]
name        = "mde-role"
description = "Mackes pinned deployment role (thin Lighthouse control plane or Workstation) + the upgrade-only /var/lib/mde/role.toml loader (E1.1)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# The role.toml is a single `role = "<name>"` field, so the loader
# hand-reads/writes it rather than pulling a TOML parser. `rustix` supplies the
# descriptor-level no-follow open used for the privileged role boundary.
[dependencies]
rustix = { version = "0.38", features = ["fs"] }

[lib]
name = "mde_role"
path = "src/lib.rs"

[lints]
workspace = true
