# MCNF E12 "Construct" — `mde-music-egui`: the egui music surface (E12-5).
#
# A daemon-projected eframe surface on the shared `mde-egui` harness. It reads
# retained catalog/playback state and emits typed actions through host-installed
# mde-bus publishers; it never owns provider credentials or playback state.
#
# Tier (§6): desktop-shell. The dependency edges point strictly INWARD —
# desktop → harness (`mde-egui`) and desktop → services (`mde-musicd`); it pulls
# in no mesh-substrate crate, so the substrate stays headless-capable.
[package]
name        = "mde-music-egui"
description = "MCNF E12 Construct — the egui-native, daemon-projected Music surface using retained mde-bus state and authenticated typed action publishers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "mde_music_egui"
path = "src/lib.rs"

[[bin]]
name = "mde-music-egui"
path = "src/main.rs"

[dependencies]
# Read-only workspace snapshots come from the canonical retained Bus lane; the
# Music surface never writes provider or playback state directly through this
# dependency.
mde-bus    = { path = "../../platform/mde-bus" }
# §4/§5 harness — the one inward desktop dependency: run_client (the eframe
# Wayland-client runner), the shared Style, and the re-exported egui/eframe so
# the surface shares one toolkit resolution.
mde-egui   = { path = "../../shared/mde-egui" }
# §6 reuse — the music service crate. We call its airsonic::Client (library
# listing + authenticated stream URL), creds (the shared credential loader),
# engine::{Engine, SourceCodec} (native playback), all already tested there.
mde-musicd = { path = "../../services/mde-musicd" }
serde_json = { workspace = true }
# Decode the daemon's local cover-art cache into egui textures. The daemon owns
# network fetches; this crate only decodes already-admitted local bytes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The worker thread owns a current-thread Tokio runtime to drive the async
# airsonic client (`net` = the IO driver hyper needs; `time` = the client's
# connect/total timeouts). The UI thread never blocks on it.
tokio      = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
