# MCNF E12 "Construct" — `mde-bookmarks-egui`: the Browser-owned bookmark panel
# (BOOKMARKS-4; design: `docs/design/mesh-bookmarks.md`).
#
# A reusable egui panel on the shared `mde-egui` toolkit that REUSES
# `mde-bookmarks`' pure model + CRDT — the `Collection`/`Bookmark`/`Folder` tree
# and the append-only `Op` set — driving every edit through those ops (§6
# glue-not-reimplementation). The Browser owns the panel lifecycle and mounts
# the locked three-region manager (folder tree · list · detail pane) plus the
# addenda's left vertical tab rail through the shared Carbon `Style` tokens
# (§4 — no raw hex).
#
# Tier (§6): desktop-shell. The edges point inward — `mde-egui` (shared toolkit)
# and `mde-bookmarks` (services model, consumed headless). Browser navigation
# (BOOKMARKS-5/6) and the Syncthing persistence worker (BOOKMARKS-2) remain
# ownership seams; the detail pane carries an honest browser seam and the model
# accepts a worker-supplied `Collection` at construction.
[package]
name        = "mde-bookmarks-egui"
description = "MCNF E12 Construct — a reusable Browser-owned egui bookmark manager panel over mde-bookmarks' pure Collection/CRDT: a three-region manager (folder tree · list · detail pane) plus a left vertical tab rail, with folder CRUD, manual + sort-by order, live title/URL search, Ctrl/Shift multi-select bulk ops, and drag reorder/move — every edit driving a real mde-bookmarks Op. Renders through the shared Carbon Style (no raw hex); Browser navigation (BOOKMARKS-5/6) is an honest detail-pane seam, not a stub."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "mde_bookmarks_egui"
path = "src/lib.rs"

[dependencies]
# The shared egui toolkit and Carbon `Style` used by the Browser-owned panel.
mde-egui = { path = "../../shared/mde-egui" }
# REUSE: the pure Bookmarks model + CRDT ops. Consumed headless (it has no GUI);
# every UI edit mints one of its `Op`s and applies it to the `Collection`.
mde-bookmarks = { path = "../../services/mde-bookmarks" }
# BOOKMARKS-7 — the manager surface talks to the daemon over the shared Bus:
# publish `action/bookmarks/check-links`, read the retained
# `state/bookmarks/link-check` status. This is a local Persist edge only; the
# model remains render/test pure.
mde-bus = { path = "../../platform/mde-bus" }
# BOOKMARKS-7 — local mirrors of the daemon's link-check wire shape.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# The per-item CRDT key type (`Uuid`) that mde-bookmarks' API returns, and
# `new_v4` to mint the id for an added bookmark/folder (lock Q1).
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
