[workspace]

[package]
name = "browser-vm-production-control"
version = "13.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "browser_vm_production_control"
path = "src/lib.rs"

[[bin]]
name = "browser-vm-guest-audio-probe-controller"
path = "src/bin/browser-vm-guest-audio-probe-controller.rs"

[[bin]]
name = "browser-vm-guest-audio-probe-hook"
path = "src/bin/browser-vm-guest-audio-probe-hook.rs"
required-features = ["host-control"]

[[bin]]
name = "browser-vm-reconnect-hook"
path = "src/bin/browser-vm-reconnect-hook.rs"
required-features = ["host-control"]

[features]
default = ["host-control"]
host-control = ["dep:mde-vdi-rdp", "dep:mde-vdi-core"]

[dependencies]
anyhow = "1"
hmac = "0.12"
mde-vdi-rdp = { path = "../../crates/desktop/mde-vdi-rdp", features = ["live-connect"], optional = true }
mde-vdi-core = { path = "../../crates/desktop/mde-vdi-core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "=0.3.36", features = ["formatting"] }
zeroize = "1"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
