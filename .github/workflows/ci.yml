# OBS-3 — MCNF CI.
#
# Enforces the AI_GOVERNANCE §7 Definition-of-Done gates on every push/PR:
# build · test (incl. the async-services worker suite) · clippy --all-targets ·
# fmt --check · the layered-tiers boundary lint (§6) · the no-private-D-Bus-name
# lint (§2) · the repository policy suite · and a hard 80% line-coverage floor
# (Q90/Q93). The crypto +
# boundary gates are deny-level: a violation fails the build, it doesn't warn.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # EFF-46 — the nightly schedule drives the `ignored-tests` job below
  # (the #[ignore]d suites that are too slow / host-dependent for the
  # per-push gates). workflow_dispatch allows an on-demand pre-cut run.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# The workflow reads source and uses the run-scoped artifact service. It does
# not write repository contents, checks, deployments, packages, or releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # E0.2 — the vendored Opus tree needs an explicit CMake policy floor; the
  # workspace .cargo/config.toml sets this too, but make it explicit for CI.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  gates:
    name: build · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The full-workspace debug build (iced + audio + all deps) + test
      # binaries + the rust-cache overflow the free runner's ~14 GB disk
      # (the cache-save post-step failed "No space left on device"). Reclaim
      # the preinstalled SDKs we don't use (~25 GB) up front.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # The audio chain links ALSA; the egui shell links GTK; the vendored Opus
      # build needs CMake. pkg-config resolves them.
      - name: System dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev cmake pkg-config protobuf-compiler mold

      - name: Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (--check)
        run: cargo fmt --all -- --check

      - name: Build (workspace)
        run: cargo build --workspace --locked

      # Everything except the two process-global/PTY-sensitive crates runs in
      # the default parallel harness (fast — e.g. mde-kdc-host's deliberate
      # sleeps/RSA-4096 keygen tests overlap).
      - name: Test (workspace, excl. serial crates)
        run: cargo test --workspace --exclude mackesd --exclude mde-term-egui --locked

      # mackesd is run SINGLE-THREADED. Several of its tests mutate
      # process-global env (`std::env::set_var` for MDE_ROLE_PATH /
      # XDG_CACHE_HOME / CREDENTIALS_DIRECTORY) while sibling tests read the
      # environment; under the default parallel harness that set_var/getenv
      # interleaving corrupts glibc's `environ` and the mackesd suite hangs
      # indefinitely. Serially it is correct (verified: 1397 pass,
      # --test-threads=1). `--features async-services` makes this the
      # superset (also compiles + runs the daemon-worker tests). Follow-up
      # (tracked): remove the test set_var hazard so this can go parallel.
      - name: Test (mackesd, serial — env-race safe)
        run: cargo test -p mackesd --features async-services --locked -- --test-threads=1

      - name: Test (terminal, serial — PTY safe)
        run: cargo test -p mde-term-egui --locked -- --test-threads=1

      - name: Product identity tests
        run: cargo test -p mde-theme --locked

      - name: Clippy (--all-targets, deny on crypto/unwrap per workspace lints)
        run: cargo clippy --workspace --all-targets --locked

      # This is the same maintained suite that the always-on farm gate runs:
      # governance, architecture, style, brand, substrate, documentation, and
      # active-worklist checks. The command returns non-zero if any check fails.
      - name: Repository policy lints (with self-tests)
        run: |
          ./install-helpers/ci-gate.sh --self-test
          ./install-helpers/ci-gate.sh policy

  coverage:
    name: coverage floor (80%, library logic)
    runs-on: ubuntu-latest
    # EFF-31 — HARD gate (was advisory). The denominator is the
    # **library logic**, which is what line-coverage meaningfully measures here.
    # The binary ENTRYPOINTS (src/bin/*.rs, src/main.rs) are
    #     --ignore-filename-regex'd — they're CLI-dispatch + daemon
    #     bootstrap glue (mackesd.rs alone is ~5.7k lines of `Cmd::`
    #     arms + run_serve wiring) that needs a live daemon/store/bus,
    #     i.e. integration territory, not unit tests.
    # Measured on this denominator: 84.84% lines (2026-06-12), so the
    # 80 floor has a ~5% margin. Ratchet the floor upward as coverage
    # grows; lowering it needs a deliberate edit, not a silent rot.
    steps:
      - uses: actions/checkout@v4

      # llvm-cov's instrumented full-workspace build is even larger than the
      # plain one — reclaim the preinstalled SDKs we don't use (~25 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: System dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev cmake pkg-config protobuf-compiler mold

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Q90/Q93 / EFF-31 — hard 80% line floor over the library-logic
      # denominator (binary entrypoints ignored — see the job comment).
      # All current workspace libraries are measured; async-services is on so
      # the worker suites
      # count; mackesd runs --test-threads=1 (its tests mutate process
      # env — EFF-18 — and race under the parallel harness).
      - name: Coverage (--fail-under-lines 80, library logic)
        run: |
          cargo llvm-cov --workspace --locked \
            --features mackesd/async-services \
            --ignore-filename-regex '(/bin/[^/]+\.rs|/main\.rs)$' \
            --fail-under-lines 80 \
            --summary-only \
            -- --test-threads=1

  # EFF-46 — the #[ignore]d suites, exercised on the nightly schedule +
  # on-demand (workflow_dispatch) so they can't rot silently. Two suites
  # exist today:
  #   * throughput_floor (mackes-nebula-https-tunnel) — slow 100 MB
  #     loopback bench; runner-runnable, hard-fails below the 5 Mb/s floor.
  #   * passcode_creds::round_trip_on_real_host (mackesd) — needs
  #     systemd-creds + the host credential key; advisory on shared
  #     runners (continue-on-error), authoritative when an operator
  #     dispatches it on a real host runner.
  ignored-tests:
    name: nightly · ignored suites
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: System dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev cmake pkg-config protobuf-compiler mold

      - name: Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - uses: Swatinem/rust-cache@v2

      - name: Throughput floor (NF-1.6, --include-ignored)
        run: |
          cargo test -p mackes-nebula-https-tunnel --locked \
            --test throughput_floor -- --include-ignored

      - name: systemd-creds round trip (advisory on shared runners)
        continue-on-error: true
        run: |
          cargo test -p mackesd --features async-services --locked \
            passcode_creds -- --include-ignored --test-threads=1

  # EFF-16 — supply-chain gates: cargo-deny (advisories · licenses ·
  # bans · sources, config in deny.toml) + a CycloneDX SBOM artifact.
  # HARD gate: the policy was validated green locally (cargo-deny
  # 0.19.8, 2026-06-12) against the full lock — advisories ok, bans ok,
  # licenses ok, sources ok — so a red here is a real regression.
  supply-chain:
    name: supply chain (cargo-deny + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: cargo-deny (advisories · licenses · bans · sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: CycloneDX SBOM
        run: cargo cyclonedx --format json --override-filename magic-mesh-sbom

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-mesh-sbom
          path: "**/magic-mesh-sbom.json"
          if-no-files-found: warn

  # EFF-32 — build/test on the REAL target: Fedora (the RPM platform),
  # with the same dnf dev libs the install docs name, plus nebula +
  # ansible-core present so environment-sensitive tests see the
  # platform binaries. Advisory (continue-on-error) until it has
  # soaked on the runner fleet — the per-push ubuntu gates stay the
  # required check; this job catches Fedora-specific drift (package
  # names, linker, system lib versions).
  #
  # aarch64 remains a noted gap: a faithful build needs an arm64
  # runner or a full cross sysroot for ALSA/GTK — tracked, not faked
  # with a check-only cross job.
  fedora:
    name: fedora-native build · test
    runs-on: ubuntu-latest
    container: fedora:44
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: System dev libraries (dnf)
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ cmake pkg-config git protobuf-compiler mold \
            gtk3-devel alsa-lib-devel openssl-devel \
            rust cargo nebula ansible-core

      - uses: Swatinem/rust-cache@v2

      - name: Build (workspace, Fedora rustc)
        run: cargo build --workspace --locked

      - name: Test (workspace, excl. serial crates)
        run: cargo test --workspace --exclude mackesd --exclude mde-term-egui --locked

      - name: Test (mackesd, serial)
        run: cargo test -p mackesd --features async-services --locked -- --test-threads=1

      - name: Test (terminal, serial)
        run: cargo test -p mde-term-egui --locked -- --test-threads=1

  # AUD-01 / WL-CRIT-006 — the farm is the heavy backend for the authoritative
  # GitHub result. This runner label is intentionally explicit: silently
  # falling back to a hosted runner would turn the farm evidence contract into
  # an assertion. The job uploads the status/log pair together so the required
  # job can verify the digest, revision, and farm-identity binding.
  farm-gate:
    name: farm gate (authoritative backend)
    runs-on: [self-hosted, linux, x64, mcnf-farm]
    steps:
      - uses: actions/checkout@v4

      - name: Verify candidate revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$EXPECTED_REVISION" || {
            echo "farm checkout revision $actual_revision does not match candidate $EXPECTED_REVISION" >&2
            exit 1
          }

      - name: Run the farm gate
        env:
          MCNF_BUILD_HOST: 172.20.0.130
          MCNF_BUILD_SLOT: github-${{ github.run_id }}-${{ github.run_attempt }}
          MCNF_BUILD_JOB_ID: github-ci:${{ github.run_id }}:${{ github.run_attempt }}
        run: ./install-helpers/ci-gate.sh run

      # Do not publish a superficially successful producer result. Verify the
      # exact candidate and farm identity while the producer's local evidence
      # is still together; github-required repeats this check after download.
      - name: Verify farm evidence before publication
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_JOB_ID: github-ci:${{ github.run_id }}:${{ github.run_attempt }}
          EXPECTED_FARM_HOST: 172.20.0.130
          EXPECTED_FARM_SLOT: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -f automation/.state/ci-gate-status.json
          test -f automation/.state/ci-gate.log
          test ! -L automation/.state/ci-gate-status.json
          test ! -L automation/.state/ci-gate.log
          ./install-helpers/ci-gate.sh verify automation/.state/ci-gate-status.json \
            --expected-revision "$EXPECTED_REVISION" \
            --expected-job-id "$EXPECTED_JOB_ID" \
            --expected-build-host "$EXPECTED_FARM_HOST" \
            --expected-build-slot "$EXPECTED_FARM_SLOT"

      # Final files are cut only after the exact green farm gate. The dedicated
      # run/attempt directory prevents a prior candidate from supplying bytes;
      # xcp-build's RPM path also performs the existing payload verification.
      - name: Build final release artifacts
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_JOB_ID: github-ci:${{ github.run_id }}:${{ github.run_attempt }}
          EXPECTED_FARM_HOST: 172.20.0.130
          EXPECTED_FARM_SLOT: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_root="/tmp/mcnf-github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upload_dir="$GITHUB_WORKSPACE/automation/.state/release-artifacts"
          case "$release_root" in
            /tmp/mcnf-github-release-[0-9]*-[0-9]*) ;;
            *) echo "unsafe release artifact root" >&2; exit 1 ;;
          esac
          case "$upload_dir" in
            "$GITHUB_WORKSPACE"/automation/.state/release-artifacts) ;;
            *) echo "unsafe upload staging root" >&2; exit 1 ;;
          esac
          rm -rf -- "$release_root" "$upload_dir"
          mkdir -m 0700 -p -- "$release_root/artifacts" "$upload_dir"
          MCNF_BUILD_HOST="$EXPECTED_FARM_HOST" \
          MCNF_BUILD_SLOT="$EXPECTED_FARM_SLOT" \
          MCNF_BUILD_JOB_ID="$EXPECTED_JOB_ID" \
          MCNF_BUILD_ARTIFACTS="$release_root/artifacts" \
            ./install-helpers/xcp-build.sh rpm
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          if find "$release_root/artifacts" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "release artifact root contains a non-regular entry" >&2
            exit 1
          fi
          mapfile -d '' artifacts < <(
            find "$release_root/artifacts" -mindepth 1 -maxdepth 1 \
              -type f -name 'magic-mesh*.rpm' -print0 | sort -z
          )
          test "${#artifacts[@]}" -gt 0 || {
            echo "RPM cut produced no final artifacts" >&2
            exit 1
          }
          test "$(find "$release_root/artifacts" -mindepth 1 -maxdepth 1 -type f -printf . | wc -c)" \
            -eq "${#artifacts[@]}" || {
              echo "release artifact root contains an unexpected file" >&2
              exit 1
            }
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact" && test ! -L "$artifact"
            cp -- "$artifact" "$upload_dir/"
          done

      # Derive the six-node collector's exact role manifest from immutable RPM
      # snapshots. This emits candidate evidence only; release signing remains
      # a separate manual operator gate.
      - name: Emit governed candidate manifest
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_root="/tmp/mcnf-github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_dir=automation/.state/candidate-evidence
          mapfile -d '' workstation_rpms < <(
            find "$release_root/artifacts" -maxdepth 1 -type f -name 'magic-mesh-[0-9]*.rpm' -print0
          )
          mapfile -d '' lighthouse_rpms < <(
            find "$release_root/artifacts" -maxdepth 1 -type f -name 'magic-mesh-lighthouse-*.rpm' -print0
          )
          test "${#workstation_rpms[@]}" -eq 1
          test "${#lighthouse_rpms[@]}" -eq 1
          rm -rf -- "$candidate_dir"
          mkdir -m 0700 -p -- "$candidate_dir"
          ./install-helpers/write-candidate-manifest.py \
            --repo "$GITHUB_WORKSPACE" \
            --revision "$EXPECTED_REVISION" \
            --workstation-rpm "${workstation_rpms[0]}" \
            --lighthouse-rpm "${lighthouse_rpms[0]}" \
            --out-dir "$candidate_dir"
          python3 install-helpers/collect-six-node-topology.py \
            --validate-candidate-manifest \
            --revision "$EXPECTED_REVISION" \
            --candidate-manifest "$candidate_dir/candidate-manifest.json"

      # Generate descriptors from the final bytes, bind them into this exact
      # green farm log/status, regenerate descriptors to catch byte changes,
      # then verify the same copies that will cross the artifact boundary.
      - name: Bind final artifacts to farm evidence
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_JOB_ID: github-ci:${{ github.run_id }}:${{ github.run_attempt }}
          EXPECTED_FARM_HOST: 172.20.0.130
          EXPECTED_FARM_SLOT: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_root="/tmp/mcnf-github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status=automation/.state/ci-gate-status.json
          binding=automation/.state/release-binding.json
          recheck=automation/.state/release-binding.recheck.json
          mapfile -d '' artifacts < <(
            find "$release_root/artifacts" -mindepth 1 -maxdepth 1 \
              -type f -name 'magic-mesh*.rpm' -print0 | sort -z
          )
          test "${#artifacts[@]}" -gt 0
          binding_args=()
          for artifact in "${artifacts[@]}"; do
            binding_args+=(--artifact "$artifact")
          done
          rm -f -- "$binding" "$recheck"
          ./install-helpers/release-evidence.sh write-binding \
            --out "$binding" \
            --source-commit "$EXPECTED_REVISION" \
            --ci-gate-status "$status" \
            "${binding_args[@]}"
          ./install-helpers/ci-gate.sh bind-release "$binding" "$status"
          ./install-helpers/release-evidence.sh write-binding \
            --out "$recheck" \
            --source-commit "$EXPECTED_REVISION" \
            --ci-gate-status "$status" \
            "${binding_args[@]}"
          cmp -s -- "$binding" "$recheck" || {
            echo "final artifacts changed after farm evidence binding" >&2
            exit 1
          }
          rm -f -- "$recheck"
          ./install-helpers/verify-github-release-binding.sh verify \
            automation/.state "$release_root/artifacts" \
            "$EXPECTED_REVISION" "$EXPECTED_JOB_ID" \
            "$EXPECTED_FARM_HOST" "$EXPECTED_FARM_SLOT"

      # Keep a byte-level receipt beside the evidence. The required verifier
      # checks this receipt after artifact download, so an artifact cannot be
      # silently substituted or partially reconstructed between jobs.
      - name: Create farm evidence manifest
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_JOB_ID: github-ci:${{ github.run_id }}:${{ github.run_attempt }}
          EXPECTED_FARM_HOST: 172.20.0.130
          EXPECTED_FARM_SLOT: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          status_file=automation/.state/ci-gate-status.json
          log_file=automation/.state/ci-gate.log
          binding_file=automation/.state/release-binding.json
          manifest=automation/.state/ci-gate-manifest.txt
          {
            printf '%s\n' 'schema=1'
            printf 'revision=%s\n' "$EXPECTED_REVISION"
            printf 'job_id=%s\n' "$EXPECTED_JOB_ID"
            printf 'build_host=%s\n' "$EXPECTED_FARM_HOST"
            printf 'build_slot=%s\n' "$EXPECTED_FARM_SLOT"
            printf 'status_bytes=%s\n' "$(stat -c '%s' "$status_file")"
            printf 'status_sha256=%s\n' "$(sha256sum "$status_file" | cut -d ' ' -f1)"
            printf 'log_bytes=%s\n' "$(stat -c '%s' "$log_file")"
            printf 'log_sha256=%s\n' "$(sha256sum "$log_file" | cut -d ' ' -f1)"
            printf 'binding_bytes=%s\n' "$(stat -c '%s' "$binding_file")"
            printf 'binding_sha256=%s\n' "$(sha256sum "$binding_file" | cut -d ' ' -f1)"
          } > "$manifest"

      - name: Upload farm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            automation/.state/ci-gate-status.json
            automation/.state/ci-gate.log
            automation/.state/ci-gate-manifest.txt
            automation/.state/release-binding.json
            automation/.state/candidate-evidence
            automation/.state/release-artifacts
          if-no-files-found: error

      - name: Clean run-scoped release staging
        if: always()
        run: |
          set -euo pipefail
          release_root="/tmp/mcnf-github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$release_root" in
            /tmp/mcnf-github-release-[0-9]*-[0-9]*) rm -rf -- "$release_root" ;;
            *) echo "unsafe release cleanup root" >&2; exit 1 ;;
          esac

  # This is the branch-protection-facing check. It must remain a separate
  # verifier: a successful farm runner is not enough unless its evidence is
  # present, digest-valid, revision-bound, and all required workflow jobs pass.
  github-required:
    name: github-required
    if: always()
    needs: [gates, coverage, ignored-tests, supply-chain, fedora, farm-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download farm evidence
        uses: actions/download-artifact@v4
        with:
          name: ci-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: farm-evidence

      - name: Install candidate artifact readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm rpm2cpio cpio

      - name: Verify authoritative results
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_JOB_ID: github-ci:${{ github.run_id }}:${{ github.run_attempt }}
          EXPECTED_FARM_HOST: 172.20.0.130
          EXPECTED_FARM_SLOT: github-${{ github.run_id }}-${{ github.run_attempt }}
          GATES_RESULT: ${{ needs.gates.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          FEDORA_RESULT: ${{ needs.fedora.result }}
          FARM_RESULT: ${{ needs.farm-gate.result }}
          IGNORED_RESULT: ${{ needs.ignored-tests.result }}
        run: |
          set -euo pipefail
          for result in "$GATES_RESULT" "$COVERAGE_RESULT" "$SUPPLY_CHAIN_RESULT" "$FEDORA_RESULT" "$FARM_RESULT"; do
            test "$result" = success || { echo "required upstream result was $result" >&2; exit 1; }
          done
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$IGNORED_RESULT" = success || { echo "scheduled ignored-tests result was $IGNORED_RESULT" >&2; exit 1; }
          fi
          test -f farm-evidence/ci-gate-status.json
          test -f farm-evidence/ci-gate.log
          test -f farm-evidence/ci-gate-manifest.txt
          test ! -L farm-evidence/ci-gate-status.json
          test ! -L farm-evidence/ci-gate.log
          test ! -L farm-evidence/ci-gate-manifest.txt
          manifest=farm-evidence/ci-gate-manifest.txt
          grep -Fqx 'schema=1' "$manifest"
          grep -Fqx "revision=$EXPECTED_REVISION" "$manifest"
          grep -Fqx "job_id=$EXPECTED_JOB_ID" "$manifest"
          grep -Fqx "build_host=$EXPECTED_FARM_HOST" "$manifest"
          grep -Fqx "build_slot=$EXPECTED_FARM_SLOT" "$manifest"
          grep -Fqx "status_bytes=$(stat -c '%s' farm-evidence/ci-gate-status.json)" "$manifest"
          grep -Fqx "status_sha256=$(sha256sum farm-evidence/ci-gate-status.json | cut -d ' ' -f1)" "$manifest"
          grep -Fqx "log_bytes=$(stat -c '%s' farm-evidence/ci-gate.log)" "$manifest"
          grep -Fqx "log_sha256=$(sha256sum farm-evidence/ci-gate.log | cut -d ' ' -f1)" "$manifest"
          grep -Fqx "binding_bytes=$(stat -c '%s' farm-evidence/release-binding.json)" "$manifest"
          grep -Fqx "binding_sha256=$(sha256sum farm-evidence/release-binding.json | cut -d ' ' -f1)" "$manifest"
          artifact_root="/tmp/mcnf-github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/artifacts"
          case "$artifact_root" in
            /tmp/mcnf-github-release-[0-9]*-[0-9]*/artifacts) ;;
            *) echo "unsafe downloaded artifact root" >&2; exit 1 ;;
          esac
          rm -rf -- "${artifact_root%/artifacts}"
          mkdir -m 0700 -p -- "$artifact_root"
          if find farm-evidence/release-artifacts -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "downloaded release artifact set contains a non-regular entry" >&2
            exit 1
          fi
          mapfile -d '' artifacts < <(
            find farm-evidence/release-artifacts -mindepth 1 -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#artifacts[@]}" -gt 0
          cp -- "${artifacts[@]}" "$artifact_root/"
          ./install-helpers/verify-github-release-binding.sh verify \
            farm-evidence \
            "$artifact_root" \
            "$EXPECTED_REVISION" "$EXPECTED_JOB_ID" \
            "$EXPECTED_FARM_HOST" "$EXPECTED_FARM_SLOT"
          evidence_copy="${artifact_root%/artifacts}/farm-evidence"
          mv -- farm-evidence "$evidence_copy"
          mapfile -d '' workstation_rpms < <(
            find "$artifact_root" -maxdepth 1 -type f -name 'magic-mesh-[0-9]*.rpm' -print0
          )
          mapfile -d '' lighthouse_rpms < <(
            find "$artifact_root" -maxdepth 1 -type f -name 'magic-mesh-lighthouse-*.rpm' -print0
          )
          test "${#workstation_rpms[@]}" -eq 1
          test "${#lighthouse_rpms[@]}" -eq 1
          regenerated="${artifact_root%/artifacts}/candidate-regenerated"
          mkdir -m 0700 -- "$regenerated"
          ./install-helpers/write-candidate-manifest.py \
            --repo "$GITHUB_WORKSPACE" \
            --revision "$EXPECTED_REVISION" \
            --workstation-rpm "${workstation_rpms[0]}" \
            --lighthouse-rpm "${lighthouse_rpms[0]}" \
            --out-dir "$regenerated"
          cmp -s -- "$regenerated/candidate-manifest.json" \
            "$evidence_copy/candidate-evidence/candidate-manifest.json"
          cmp -s -- "$regenerated/candidate-source-receipt.json" \
            "$evidence_copy/candidate-evidence/candidate-source-receipt.json"
          python3 install-helpers/collect-six-node-topology.py \
            --validate-candidate-manifest \
            --revision "$EXPECTED_REVISION" \
            --candidate-manifest "$evidence_copy/candidate-evidence/candidate-manifest.json"
          rm -rf -- "${artifact_root%/artifacts}"
