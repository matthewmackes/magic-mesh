[Service]
# Installed only for an explicitly staged, request-bound Surface MOK import.
# Both sources are already systemd-encrypted, host-bound blobs under /run;
# systemd decrypts them into this service activation's private credential
# directory. The provisioner stops the actions process before replacing the
# pair, so no process can observe a mixed credential generation.
LoadCredentialEncrypted=surface-mok-import.sealed:/run/credstore.encrypted/surface-mok-import.sealed
LoadCredentialEncrypted=surface-mok-import-passphrase:/run/credstore.encrypted/surface-mok-import-passphrase
