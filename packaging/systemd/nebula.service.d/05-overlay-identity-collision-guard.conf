# WL-CRIT-007 typed activation blocker.
# ACTIVATION_BLOCKER=pre-nebula-current-authority-transport-unavailable
#
# The authenticated snapshot producer is intentionally ordered after Nebula and
# etcd. Its /run commitment disappears on reboot, so persisted snapshots are
# correctly unusable at the next boot. No authenticated source currently
# refreshes that commitment before overlay startup. Therefore this drop-in is
# intentionally inert: it contains no [Unit], [Service], or ExecStartPre entry.
# Activating the guard here before that transport exists would recreate the
# overlay/etcd cold-boot dependency cycle and keep every correctly enrolled node
# offline.
