# WL-CRIT-007/S1: establish network readiness, then admit exactly one current
# local Nebula identity. The guard rejects expired/untrusted certificates,
# unsafe key state, and mixed generation/flat identities before any overlay
# packet can be sent. Distributed live-claim collision refusal remains a later
# authority-transport slice; it cannot be placed before Nebula without creating
# an overlay/etcd cold-boot cycle.
[Unit]
Requires=network-online.target
After=network-online.target
Before=etcd.service syncthing.service mackesd.target

[Service]
# The same root-owned helper ships in every role package. It rejects unsafe
# config/CA/certificate/key ownership, mixed flat/generation identity state,
# stale certificates, and malformed generations before the overlay starts.
ExecStartPre=/usr/libexec/mackesd/verify-boot-recovery --identity-guard
