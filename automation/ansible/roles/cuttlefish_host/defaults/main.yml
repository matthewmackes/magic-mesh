---
# WL-ARCH-006 (U13) — cuttlefish_host role defaults (runs inside the Android VM).

# Local paths / URLs of the android-cuttlefish .deb host packages to install
# (e.g. cuttlefish-base_*.deb, cuttlefish-user_*.deb). Empty = assume a pre-baked
# golden Android image already carries cvd; the role then only asserts cvd and
# (re)starts the device.
cuttlefish_debs: []

# Content-declared release handoff. These controller-side paths are mandatory:
# the role refuses before apt, service, or cvd effects unless their hashes match
# the declaration and the exact payload is staged privately.
cuttlefish_release_declaration: ""
cuttlefish_readiness_relay: ""
cuttlefish_vdi_agent: ""
cuttlefish_payload_stage_dir: /var/lib/mcnf/cuttlefish-release-payload
cuttlefish_readiness_relay_install_path: /usr/libexec/mcnf-cuttlefish-readiness-relay
cuttlefish_vdi_agent_install_path: /usr/libexec/mcnf-cuttlefish-vdi-agent

# Runtime attachment identity consumed by the packaged readiness-relay unit.
# These values are deliberately mandatory: provisioning must not report a
# usable Android guest when it cannot publish a typed, session-bound VDI source.
cuttlefish_mesh_host: ""
cuttlefish_webrtc_port: 0
cuttlefish_session_id: ""
cuttlefish_guest_environment_path: /etc/mcnf/cuttlefish-guest.conf

# The unprivileged user that owns the cvd runtime.
cuttlefish_user: cvd

# Groups cvd needs: KVM access + the cuttlefish bridge network.
cuttlefish_groups:
  - kvm
  - cvdnetwork

# Host bridge/network units the android-cuttlefish debs install (enabled if given).
cuttlefish_host_services: []

# Optional device shape passed through to `cvd start` (defaults = cvd's own).
# cuttlefish_cpus: 4
# cuttlefish_memory_mb: 8192
