---
# WL-ARCH-006 (U13) — cuttlefish_host role defaults (runs inside the Android VM).

# Local paths / URLs of the android-cuttlefish .deb host packages to install
# (e.g. cuttlefish-base_*.deb, cuttlefish-user_*.deb). Empty = assume a pre-baked
# golden Android image already carries cvd; the role then only asserts cvd and
# (re)starts the device.
cuttlefish_debs: []

# Signed first-release handoff. These controller-side paths are mandatory: the
# role refuses before apt, service, or cvd effects unless their exact bytes are
# authenticated by the project release signer and staged privately.
cuttlefish_release_declaration: ""
cuttlefish_release_signature: ""
cuttlefish_readiness_relay: ""
cuttlefish_vdi_agent: ""
cuttlefish_payload_stage_dir: /var/lib/mcnf/cuttlefish-release-payload
cuttlefish_readiness_relay_install_path: /usr/local/libexec/mcnf-cuttlefish-readiness-relay
cuttlefish_vdi_agent_install_path: /usr/local/libexec/mcnf-cuttlefish-vdi-agent

# The unprivileged user that owns the cvd runtime.
cuttlefish_user: cvd

# Groups cvd needs: KVM access + the cuttlefish bridge network.
cuttlefish_groups:
  - kvm
  - cvdnetwork

# Host bridge/network units the android-cuttlefish debs install (enabled if given).
cuttlefish_host_services: []

# Optional device shape passed through to `cvd start` (defaults = cvd's own).
# cuttlefish_cpus: 4
# cuttlefish_memory_mb: 8192
