---
# WL-ARCH-006 (U13) — install Cuttlefish + cvd on an Android-VM and start it with
# a VNC server.
#
# Per the plan's two-layer Android path (U9): the AndroidVm is a nested-KVM Debian
# VM (host-passthrough CPU, ≥8G/≥4vcpu/≥80G). This role runs INSIDE that Debian VM
# — it installs the android-cuttlefish host packages, puts the run user in the KVM
# + cuttlefish-network groups, and launches `cvd start --start_vnc_server`. The
# console is then VNC/WebRTC (the console-attach verb, U8). Because the Android VM
# is a Debian base and not a mackesd mesh node, it is NOT in the cloud_vm group —
# the base cloud_vm convergence does not run here.

- name: Refuse an incomplete Cuttlefish guest payload handoff
  ansible.builtin.assert:
    that:
      - cuttlefish_release_declaration | length > 0
      - cuttlefish_readiness_relay | length > 0
      - cuttlefish_vdi_agent | length > 0
      - cuttlefish_debs | length > 0
      - cuttlefish_readiness_relay_install_path == '/usr/libexec/mcnf-cuttlefish-readiness-relay'
      - cuttlefish_vdi_agent_install_path == '/usr/libexec/mcnf-cuttlefish-vdi-agent'
      - cuttlefish_guest_environment_path == '/etc/mcnf/cuttlefish-guest.conf'
      - cuttlefish_mesh_host is match('^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,253}[A-Za-z0-9])?$')
      - (cuttlefish_webrtc_port | string) is match('^[0-9]{1,5}$')
      - (cuttlefish_webrtc_port | int) >= 1
      - (cuttlefish_webrtc_port | int) <= 65535
      - cuttlefish_session_id is match('^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$')
    fail_msg: >-
      Cuttlefish provisioning requires a content declaration, readiness relay,
      VDI agent, at least one guest package, and a
      bounded session attachment identity matching the packaged service paths.

- name: Create private parent for the verified payload stage
  ansible.builtin.file:
    path: "{{ cuttlefish_payload_stage_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Refuse reuse of an earlier Cuttlefish payload stage
  ansible.builtin.file:
    path: "{{ cuttlefish_payload_stage_dir }}"
    state: absent

- name: Verify and stage the exact content-declared Cuttlefish guest payload
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../../packaging/android/verify-guest-payload.sh
      --declaration {{ cuttlefish_release_declaration | quote }}
      --readiness-relay {{ cuttlefish_readiness_relay | quote }}
      --vdi-agent {{ cuttlefish_vdi_agent | quote }}
      --stage-dir {{ cuttlefish_payload_stage_dir | quote }}
      {% for package in cuttlefish_debs %} --guest-package {{ package | quote }}{% endfor %}
  register: cuttlefish_payload_admission
  changed_when: true

- name: Install the verified readiness relay
  ansible.builtin.copy:
    src: "{{ cuttlefish_payload_stage_dir }}/readiness-relay"
    dest: "{{ cuttlefish_readiness_relay_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Install the verified VDI agent
  ansible.builtin.copy:
    src: "{{ cuttlefish_payload_stage_dir }}/vdi-agent"
    dest: "{{ cuttlefish_vdi_agent_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Assert nested KVM is available (Cuttlefish needs /dev/kvm)
  ansible.builtin.stat:
    path: /dev/kvm
  register: cuttlefish_kvm
  failed_when: not cuttlefish_kvm.stat.exists

- name: Install the android-cuttlefish host .deb packages
  ansible.builtin.apt:
    deb: "{{ cuttlefish_payload_stage_dir }}/packages/{{ item | basename }}"
  loop: "{{ cuttlefish_debs }}"

- name: Assert cvd is installed (from the debs above or a pre-baked golden image)
  ansible.builtin.command: cvd version
  register: cuttlefish_cvd_version
  changed_when: false
  failed_when: cuttlefish_cvd_version.rc != 0

- name: Ensure the run user is in the kvm + cuttlefish-network groups
  ansible.builtin.user:
    name: "{{ cuttlefish_user }}"
    groups: "{{ cuttlefish_groups }}"
    append: true

- name: Create the private Cuttlefish guest configuration directory
  ansible.builtin.file:
    path: "{{ cuttlefish_guest_environment_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bind the readiness relay to the governed VDI session identity
  ansible.builtin.copy:
    dest: "{{ cuttlefish_guest_environment_path }}"
    owner: root
    group: "{{ cuttlefish_user }}"
    mode: "0640"
    content: |
      MCNF_MESH_HOST={{ cuttlefish_mesh_host }}
      MCNF_WEBRTC_PORT={{ cuttlefish_webrtc_port | int }}
      MCNF_SESSION_ID={{ cuttlefish_session_id }}
  register: cuttlefish_guest_environment

- name: Enable the cuttlefish host bridge/network services (if the debs shipped them)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ cuttlefish_host_services }}"
  when: cuttlefish_host_services | length > 0

- name: Check whether a cvd instance is already running (idempotency guard)
  ansible.builtin.command: cvd status
  register: cuttlefish_status
  become: true
  become_user: "{{ cuttlefish_user }}"
  changed_when: false
  failed_when: false

- name: Start the Cuttlefish device with a VNC server
  ansible.builtin.command: >-
    cvd start --start_vnc_server
    {% if cuttlefish_cpus is defined %} --cpus {{ cuttlefish_cpus }}{% endif %}
    {% if cuttlefish_memory_mb is defined %} --memory_mb {{ cuttlefish_memory_mb }}{% endif %}
  become: true
  become_user: "{{ cuttlefish_user }}"
  register: cuttlefish_start
  changed_when: cuttlefish_start.rc == 0
  # `cvd status` exits non-zero when no device is running — the honest idempotency
  # guard: only start when nothing is already up.
  when: cuttlefish_status.rc != 0

- name: Enable the readiness relay after Cuttlefish is available
  ansible.builtin.systemd:
    name: mcnf-cuttlefish-readiness-relay.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if cuttlefish_guest_environment.changed else 'started' }}"
